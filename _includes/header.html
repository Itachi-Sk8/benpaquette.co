    <!-- ========== Site header (shared) ========== -->
    <header class="site-header">
        <div class="container site-header__inner">
            <a class="site-brand" href="/">
                <span class="site-brand__mark" aria-hidden="true">BP</span>
                Ben Paquette
            </a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
                <span class="nav-toggle__bars" aria-hidden="true"></span>
            </button>
            <nav class="site-nav" id="site-nav" aria-label="Main">
                <ul class="site-nav__list">
                    {%- for link in site.data.navigation %}
                    {%- include nav-current.html url=link.url %}
                    <li><a class="site-nav__link" href="{{ link.url }}"{% if nav_current %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
                    {%- endfor %}
                    <li class="site-nav__cta-item"><a class="btn btn--outline btn--small site-nav__cta" href="/Media/Resume_Paquette.pdf">R&eacute;sum&eacute;</a></li>
                </ul>
            </nav>
        </div>
    </header>
